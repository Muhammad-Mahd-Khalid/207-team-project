name: Clean Code Utilities

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  # 1. Verification job: fails the build if formatting is wrong
  checkstyle-and-spotless-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Checkstyle
        run: mvn -B checkstyle:check --file pom.xml

      - name: Run Spotless Check
        run: mvn -B spotless:check --file pom.xml

  # 2. Auto-format job: applies fixes and pushes them back
  spotless-apply:
    runs-on: ubuntu-latest
    # Only run on pushes to a branch, and skip forked PRs where push access is unavailable
    if: github.event_name == 'push' && !github.event.repository.fork
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Apply Spotless
        run: mvn -B spotless:apply --file pom.xml

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Apply Spotless formatting changes"
          branch: ${{ github.head_ref || github.ref_name }}